name: Render Short Video

on:
  workflow_dispatch:
    inputs:
      topic_id:
        description: 'Topic ID (e.g. T1)'
        required: true
      topic_title:
        description: 'Topic Title'
        required: true
      script:
        description: 'Voiceover Script'
        required: true

jobs:
  build-video:
    runs-on: ubuntu-latest
    steps:
      - name: Install FFmpeg & Edge-TTS
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install edge-tts

      - name: Generate Voiceover & 1080x1920 Image
        run: |
          edge-tts --voice "en-US-AndrewMultilingualNeural" --text "${{ github.event.inputs.script }}" --write-media voice.mp3
          ENCODED_TITLE=$(python3 -c "import urllib.parse, sys; print(urllib.parse.quote(sys.argv[1]))" "${{ github.event.inputs.topic_title }}")
          curl -L "https://image.pollinations.ai/prompt/${ENCODED_TITLE}%20vertical%209:16%20cinematic%20aesthetic?width=1080&height=1920&nologo=true" -o bg.jpg

      - name: Render Vertical MP4 with FFmpeg
        run: |
          ffmpeg -loop 1 -i bg.jpg -i voice.mp3 -vf "scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920,zoompan=z='min(zoom+0.0005,1.15)':d=1:s=1080x1920" -c:v libx264 -tune stillimage -c:a aac -b:a 192k -pix_fmt yuv420p -shortest "${{ github.event.inputs.topic_id }}.mp4"

      - name: Upload MP4 to Google Drive & Update Sheet
        env:
          APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
          TOPIC_ID: ${{ github.event.inputs.topic_id }}
        run: |
          python3 - << 'EOF'
          import base64, json, os, urllib.request

          topic_id = os.environ["TOPIC_ID"]
          with open(f"{topic_id}.mp4", "rb") as f:
              b64 = base64.b64encode(f.read()).decode("utf-8")

          payload = json.dumps({"topic_id": topic_id, "video_base64": b64}).encode("utf-8")
          req = urllib.request.Request(os.environ["APPS_SCRIPT_URL"], data=payload, headers={"Content-Type": "application/json"})
          with urllib.request.urlopen(req) as resp:
              print(resp.read().decode("utf-8"))
          EOF
