name: Render 4K Multi-Animation Short

on:
  workflow_dispatch:
    inputs:
      topic_id:
        description: 'Topic ID'
        required: true
      topic_title:
        description: 'Topic Title'
        required: true
      script:
        description: 'Script'
        required: true

jobs:
  build-video:
    runs-on: ubuntu-latest
    steps:
      - name: Install 4K Video, AI Animation & Neural Voice Tools
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg fonts-montserrat fonts-dejavu-core curl
          pip install --upgrade kokoro-onnx soundfile numpy pillow gradio_client
          mkdir -p tts_model
          curl -sL "https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.onnx" -o tts_model/kokoro-v1.0.onnx
          curl -sL "https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin" -o tts_model/voices-v1.0.bin

      - name: Generate 4K Multi-Animation Scenes & Neural Voice
        env:
          SCRIPT_TEXT: ${{ github.event.inputs.script }}
          TOPIC_TITLE: ${{ github.event.inputs.topic_title }}
          TOPIC_ID: ${{ github.event.inputs.topic_id }}
        run: |
          cat << 'EOF' > make_video.py
          import math, os, random, re, shutil, subprocess, urllib.parse, urllib.request
          import numpy as np
          import soundfile as sf
          from kokoro_onnx import Kokoro
          from PIL import Image, ImageDraw, ImageEnhance, ImageFilter

          title = os.environ.get("TOPIC_TITLE", "").strip() or "Secret AI Shortcut"
          raw_script = os.environ.get("SCRIPT_TEXT", "").strip()
          topic_id = os.environ.get("TOPIC_ID", "").strip() or "T_TEST"

          # 1. Build a High-Retention 28-36s Hook-Driven Script if input is short or generic
          if len(raw_script.split()) < 60 or "welcome to" in raw_script.lower():
              script = (
                  f"Stop scrolling! Nobody is telling you the real secret behind {title}. "
                  f"While ninety-nine percent of people waste hours doing things the hard way, top creators use this exact three-step shift to get ten times faster results. "
                  f"First, lock in your core hook in the first two seconds so viewers cannot look away. "
                  f"Second, combine real human energy with fast visual pattern interrupts every three seconds. "
                  f"Try this today on your very next post and watch your growth explode!"
              )
          else:
              script = raw_script

          # 2. Content-Matched Kokoro-82M Neural Voiceover
          combined = (title + " " + script).lower()
          if any(k in combined for k in ["baby", "cute", "monkey", "animal", "funny", "kid", "mom", "dad", "love", "story"]):
              voice_id = "af_heart"
              base_speed = 1.05
          elif any(k in combined for k in ["hack", "trick", "money", "cheat", "secret", "mistake", "rupee", "₹", "student", "creator", "stop scrolling"]):
              voice_id = "am_fenrir"
              base_speed = 1.10
          else:
              voice_id = "am_michael"
              base_speed = 1.07

          kokoro = Kokoro("tts_model/kokoro-v1.0.onnx", "tts_model/voices-v1.0.bin")
          sentences = [s.strip() for s in re.split(r'(?<=[.!?])\s+', script) if s.strip()] or [script]

          audio_segments = [np.zeros(int(24000 * 0.04), dtype=np.float32)]
          word_timings = []
          cursor_t = 0.04
          sr = 24000

          for idx_s, sent in enumerate(sentences):
              spd = base_speed * (1.06 if idx_s == 0 else (0.98 if idx_s == len(sentences) - 1 else 1.01))
              samples, sr = kokoro.create(sent, voice=voice_id, speed=spd, lang="en-us")
              non_silent = np.where(np.abs(samples) > 0.008)[0]
              if len(non_silent) > 0:
                  samples = samples[max(0, non_silent[0]-300):min(len(samples), non_silent[-1]+500)]
              sent_dur = len(samples) / float(sr)

              s_words = sent.split()
              weights = [max(len(re.sub(r'[^A-Za-z0-9]', '', w)), 2) for w in s_words]
              w_sum = float(sum(weights)) or 1.0
              w_cursor = cursor_t
              for w_txt, wt in zip(s_words, weights):
                  w_dur = sent_dur * (wt / w_sum)
                  word_timings.append((w_cursor, w_cursor + w_dur, w_txt))
                  w_cursor += w_dur

              audio_segments.append(samples)
              cursor_t += sent_dur
              if idx_s < len(sentences) - 1:
                  audio_segments.append(np.zeros(int(sr * 0.18), dtype=np.float32))
                  cursor_t += 0.18

          full_voice = np.concatenate(audio_segments)
          sf.write("voice_raw.wav", full_voice, sr)

          subprocess.run([
              "ffmpeg", "-y", "-i", "voice_raw.wav",
              "-af", "equalizer=f=115:t=q:w=1.1:g=3.5,equalizer=f=3800:t=q:w=1.4:g=3.2,acompressor=threshold=-16dB:ratio=3.5:attack=8:release=100,loudnorm",
              "voice.wav"
          ], check=True)

          voice_dur = len(full_voice) / float(sr)
          total_dur = max(25.0, min(40.0, voice_dur + 0.6))
          print(f"Target 4K Video Duration: {total_dur:.2f}s")

          # 3. Build 4K (2160x3840) Kinetic Word-by-Word Pop Subtitles
          def fmt_ass(sec):
              h = int(sec // 3600)
              m = int((sec % 3600) // 60)
              s = int(sec % 60)
              cs = int((sec - int(sec)) * 100)
              return f"{h}:{m:02d}:{s:02d}.{cs:02d}"

          ass_header = """[Script Info]
          ScriptType: v4.00+
          PlayResX: 2160
          PlayResY: 3840

          [V4+ Styles]
          Format: Name, Fontname, Fontsize, PrimaryColour, SecondaryColour, OutlineColour, BackColour, Bold, Italic, Underline, StrikeOut, ScaleX, ScaleY, Spacing, Angle, BorderStyle, Outline, Shadow, Alignment, MarginL, MarginR, MarginV, Encoding
          Style: Kinetic4K,Montserrat,152,&H00FFFFFF,&H0000D7FF,&H00050505,&HAA000000,-1,0,0,0,100,100,2,0,1,12,8,2,120,120,660,1
          Style: Hook4K,Montserrat,126,&H0018D4FF,&H00FFFFFF,&H00050505,&HBB000000,-1,0,0,0,100,100,4,0,1,10,8,8,120,120,280,1

          [Events]
          Format: Layer, Start, End, Style, Name, MarginL, MarginR, MarginV, Effect, Text
          """

          events = []
          clean_hook = re.sub(r"[^A-Za-z0-9 !&\-]", "", title.upper())[:26]
          events.append(
              f"Dialogue: 1,0:00:00.00,{fmt_ass(min(3.0, total_dur))},Hook4K,,0,0,0,,"
              f"{{\\fad(120,160)\\fscx80\\fscy80\\t(0,220,\\fscx106\\fscy106)\\t(220,340,\\fscx100\\fscy100)}}{clean_hook}"
          )

          for g_start in range(0, len(word_timings), 3):
              grp = word_timings[g_start:g_start+3]
              for active_i, (wt0, wt1, _) in enumerate(grp):
                  styled_words = []
                  for j, (_, _, w_str) in enumerate(grp):
                      if j == active_i:
                          styled_words.append(r"{\c&H001AD6FF&\fscx124\fscy124\t(0,85,\fscx108\fscy108)}" + w_str + r"{\c&H00FFFFFF&\fscx100\fscy100}")
                      else:
                          styled_words.append(w_str)
                  events.append(f"Dialogue: 0,{fmt_ass(wt0)},{fmt_ass(wt1)},Kinetic4K,,0,0,0,,{' '.join(styled_words)}")

          with open("captions.ass", "w", encoding="utf-8") as af:
              af.write(ass_header + "\n".join(events))

          # 4. Generate True Multi-Animation Clips (Creator POV + AI Anime + 3D Cinematic)
          num_scenes = 8
          seg_dur = total_dur / float(num_scenes)
          words = script.split()
          chunk_len = max(1, len(words) // num_scenes)
          scene_beats = [" ".join(words[i*chunk_len:(i+1)*chunk_len]) for i in range(num_scenes)]

          creator_prompt = (
              "Dynamic handheld smartphone camera, rapid zoom-in on hook, immersive first-person POV, shallow depth of field, "
              "4k resolution, cinematic mobile style. A relatable Gen-Z creator sitting in a clean modern aesthetic bedroom "
              "with warm LED strip lights and golden hour glow, looking intensely into camera lens with high energy, "
              "expressive hand gestures, subtle blinking, realistic skin texture, natural shadows, no text, no watermark."
          )
          anime_prompts = [
              "High-budget Japanese anime animation scene, Makoto Shinkai and Jujutsu Kaisen dynamic lighting, glowing golden energy aura, wind blowing hair, dramatic camera orbit, vibrant neon particles, 4k anime sakuga, no text",
              "Epic anime protagonist breakthrough moment, electric cyan and gold lightning effects, fast speed lines, dramatic rim light, ultra-detailed anime cinematography, 4k vertical animation, no text",
              "3D Pixar and modern anime hybrid animation, futuristic glowing holographic workspace floating in air, dynamic camera push-in, cinematic depth of field, 4k render, no text",
              "Vibrant anime city skyline at golden sunset with glowing light trails and flying energy sparks, smooth cinematic camera sweep, 4k anime movie frame, no text"
          ]

          from gradio_client import Client
          video_clients = []
          for space_id in ["Lightricks/ltx-video-distilled", "Wan-AI/Wan2.1", "hysts/CogVideoX-5b"]:
              try:
                  video_clients.append((space_id, Client(space_id)))
                  print("Connected AI video space:", space_id)
              except Exception as e:
                  print("Space unavailable:", space_id, e)

          def generate_ai_video_clip(prompt_text, out_mp4, seed_val):
              for space_id, cl in video_clients:
                  try:
                      if "ltx" in space_id.lower():
                          res = cl.predict(
                              prompt=prompt_text,
                              negative_prompt="blurry, low quality, deformed hands, extra fingers, morphing face, stiff body, robotic movement, dead eyes, bad anatomy, text overlay, watermarks",
                              height=768,
                              width=448,
                              num_frames=97,
                              seed=seed_val,
                              api_name="/text_to_video"
                          )
                      else:
                          res = cl.predict(prompt=prompt_text, api_name="/predict")
                      vid_path = res[0] if isinstance(res, (list, tuple)) else (res.get("video") if isinstance(res, dict) else res)
                      if vid_path and os.path.exists(str(vid_path)) and os.path.getsize(str(vid_path)) > 15000:
                          shutil.copy(str(vid_path), out_mp4)
                          return True
                  except Exception as e:
                      print(f"Video gen retry on {space_id}:", e)
              return False

          # Fallback: Multi-layer animated anime/creator composite with dynamic particle & light-sweep animation
          def generate_animated_fallback(beat_text, is_creator, idx_sc, out_mp4):
              style_tag = (
                  "photorealistic Gen-Z creator in warm LED aesthetic bedroom talking to camera with hand gestures, golden hour lighting, 4k"
                  if is_creator else
                  "high-energy Japanese anime sakuga scene, glowing golden energy aura, dynamic speed lines, vibrant lighting, 4k"
              )
              full_p = f"{beat_text[:70]}, {title}, {style_tag}, no text"
              img_path = f"base_{idx_sc}.jpg"
              got_img = False
              for model_name in ["flux", "turbo"]:
                  try:
                      u = f"https://image.pollinations.ai/prompt/{urllib.parse.quote(full_p)}?width=1080&height=1920&model={model_name}&nologo=true&seed={600+idx_sc*47}"
                      req = urllib.request.Request(u, headers={"User-Agent": "Mozilla/5.0"})
                      with urllib.request.urlopen(req, timeout=30) as r:
                          data = r.read()
                      with open(img_path, "wb") as f:
                          f.write(data)
                      im = Image.open(img_path).convert("RGB")
                      if im.size[0] >= 400:
                          w, h = im.size
                          im = im.crop((0, 0, w, int(h * 0.94))).resize((1080, 1920), Image.LANCZOS)
                          im = ImageEnhance.Contrast(im).enhance(1.18)
                          im = ImageEnhance.Color(im).enhance(1.22)
                          im.save(img_path, "JPEG", quality=94)
                          got_img = True
                          break
                  except Exception:
                      pass

              if not got_img:
                  # Generate rich anime-style energy burst frame with radial light beams & glowing particles
                  im = Image.new("RGB", (1080, 1920), (12, 14, 28))
                  dr = ImageDraw.Draw(im, "RGBA")
                  c1 = (255, 195, 55) if is_creator else (0, 225, 255)
                  c2 = (255, 95, 65) if is_creator else (180, 70, 255)
                  for r_step in range(18, 0, -1):
                      rad = r_step * 75
                      alpha = int(18 + (18 - r_step) * 5)
                      dr.ellipse([540-rad, 880-rad, 540+rad, 880+rad], fill=(c1[0], c1[1], c1[2], alpha))
                  rng = random.Random(300 + idx_sc * 19)
                  for _ in range(36):
                      ang = rng.uniform(0, math.pi * 2)
                      x2, y2 = int(540 + math.cos(ang)*1400), int(880 + math.sin(ang)*1400)
                      dr.line([(540, 880), (x2, y2)], fill=(c2[0], c2[1], c2[2], 55), width=rng.randint(3, 12))
                  im = im.filter(ImageFilter.GaussianBlur(radius=6))
                  im.save(img_path, "JPEG", quality=92)

              frames = int(math.ceil(seg_dur * 30)) + 4
              # Rapid hook zoom-in on scene 0, dynamic handheld motion + glowing lens flare sweep on others
              if idx_sc == 0:
                  zp = f"zoompan=z='min(1.02 + 0.30*pow(on/{frames},0.5), 1.32)':x='iw/2-(iw/zoom/2)+sin(on*0.25)*16':y='ih/2-(ih/zoom/2)+cos(on*0.20)*12':d={frames}:s=1080x1920:fps=30"
              else:
                  zp = f"zoompan=z='max(1.28 - 0.24*pow(on/{frames},0.6), 1.04)':x='iw/2-(iw/zoom/2)+sin(on*0.18)*18':y='ih/2-(ih/zoom/2)+cos(on*0.15)*12':d={frames}:s=1080x1920:fps=30"

              subprocess.run([
                  "ffmpeg", "-y", "-loop", "1", "-t", f"{seg_dur + 0.3:.3f}", "-i", img_path,
                  "-vf", f"scale=1380:2453,{zp},trim=duration={seg_dur:.4f},setpts=PTS-STARTPTS",
                  "-c:v", "libx264", "-preset", "fast", "-crf", "19", "-pix_fmt", "yuv420p", out_mp4
              ], check=True)

          clip_files = []
          for i, beat in enumerate(scene_beats):
              clip_mp4 = f"clip_{i}.mp4"
              is_creator_scene = (i % 2 == 0)
              if is_creator_scene:
                  p_text = f"{creator_prompt} Speaking passionately about: {beat[:70]}"
              else:
                  p_text = f"{anime_prompts[(i//2) % len(anime_prompts)]}, depicting: {beat[:70]}, {title}"

              ok = generate_ai_video_clip(p_text, clip_mp4, 1000 + i * 37)
              if not ok:
                  generate_animated_fallback(beat, is_creator_scene, i, clip_mp4)
              clip_files.append(clip_mp4)

          # 5. Synthesize High-Energy Modern Phonk / Electronic Creator Beat
          subprocess.run([
              "ffmpeg", "-y",
              "-f", "lavfi", "-i", f"sine=f=55.0:d={total_dur}:r=44100",
              "-f", "lavfi", "-i", f"sine=f=110.0:d={total_dur}:r=44100",
              "-f", "lavfi", "-i", f"anoisesrc=d={total_dur}:c=pink:r=44100:a=0.035",
              "-filter_complex",
              "[0:a]tremolo=f=2.6:d=0.88,volume=0.09[bass];"
              "[1:a]tremolo=f=5.2:d=0.72,volume=0.04[pulse];"
              "[2:a]bandpass=f=1100:width_type=h:w=650,tremolo=f=2.6:d=0.95,volume=0.16[hat];"
              f"[bass][pulse][hat]amix=inputs=3:duration=shortest,afade=t=in:st=0:d=0.25,afade=t=out:st={max(total_dur-0.7,0.4)}:d=0.7[bg]",
              "-map", "[bg]", "bgm.wav"
          ], check=True)

          # 6. Concatenate All Multi-Animation Clips + Upscale to True 4K (2160x3840) + Burn 4K Captions
          inputs = []
          filter_parts = []
          concat_v = ""
          for i, cf in enumerate(clip_files):
              inputs.extend(["-stream_loop", "-1", "-t", f"{seg_dur:.4f}", "-i", cf])
              # Upscale to true 4K vertical 2160x3840 with Lanczos + unsharp 4K crispness
              filter_parts.append(
                  f"[{i}:v]fps=30,scale=2160:3840:force_original_aspect_ratio=increase:flags=lanczos,"
                  f"crop=2160:3840,unsharp=5:5:0.85:5:5:0.0,trim=duration={seg_dur:.4f},setpts=PTS-STARTPTS[v{i}];"
              )
              concat_v += f"[v{i}]"

          voice_idx = num_scenes
          bgm_idx = num_scenes + 1
          inputs.extend(["-i", "voice.wav", "-i", "bgm.wav"])

          filter_parts.append(
              f"{concat_v}concat=n={num_scenes}:v=1:a=0[v4k];"
              f"[v4k]vignette=PI/5.5,ass=captions.ass,format=yuv420p[outv];"
              f"[{voice_idx}:a]volume=1.42[va];"
              f"[{bgm_idx}:a]volume=0.92[ba];"
              f"[va][ba]amix=inputs=2:duration=first:dropout_transition=1[outa]"
          )

          subprocess.run([
              "ffmpeg", "-y",
              *inputs,
              "-filter_complex", "".join(filter_parts),
              "-map", "[outv]", "-map", "[outa]",
              "-c:v", "libx264", "-preset", "medium", "-crf", "18",
              "-c:a", "aac", "-b:a", "256k", "-pix_fmt", "yuv420p", "-shortest",
              f"{topic_id}.mp4"
          ], check=True)
          EOF
          python3 make_video.py

      - name: Upload 4K Video to Google Drive & Update Sheet
        env:
