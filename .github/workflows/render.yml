name: Render Short Video

on:
  workflow_dispatch:
    inputs:
      topic_id:
        description: 'Topic ID'
        required: true
      topic_title:
        description: 'Topic Title'
        required: true
      script:
        description: 'Script'
        required: true

jobs:
  build-video:
    runs-on: ubuntu-latest
    steps:
      - name: Install Tools
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-core fonts-noto-extra fonts-montserrat
          pip install --upgrade edge-tts gTTS pillow

      - name: Generate Tamil Voiceover, 3D Cinematic Scenes & Pro Transitions
        env:
          SCRIPT_TEXT: ${{ github.event.inputs.script }}
          TOPIC_TITLE: ${{ github.event.inputs.topic_title }}
          TOPIC_ID: ${{ github.event.inputs.topic_id }}
        run: |
          cat << 'EOF' > make_video.py
          import asyncio, math, os, re, subprocess, urllib.parse, urllib.request
          import edge_tts
          from gtts import gTTS
          from PIL import Image, ImageDraw, ImageEnhance

          title = os.environ.get("TOPIC_TITLE", "").strip() or "Futuristic AI Revolution"
          raw_script = os.environ.get("SCRIPT_TEXT", "").strip()
          script = raw_script if len(raw_script) > 3 else "இது வெறும் ஆரம்பம் மட்டுமே! எதிர்கால தொழில்நுட்ப உலகத்திற்கு உங்களை வரவேற்கிறோம்."
          topic_id = os.environ.get("TOPIC_ID", "").strip() or "T_TEST"

          # Detect if script contains Tamil Unicode characters
          has_tamil = any('\u0B80' <= ch <= '\u0BFF' for ch in script)

          # 1. Generate studio-grade Tamil (or English) neural voiceover
          word_events = []
          audio_ok = False

          voices = ["ta-IN-ValluvarNeural", "ta-IN-PallaviNeural"] if has_tamil else ["en-US-ChristopherNeural", "en-US-AndrewNeural"]

          async def try_edge(voice_name):
              word_events.clear()
              comm = edge_tts.Communicate(script, voice_name, rate="+6%", pitch="-3Hz", boundary="WordBoundary")
              with open("voice_raw.mp3", "wb") as af:
                  async for chunk in comm.stream():
                      if chunk["type"] == "audio":
                          af.write(chunk["data"])
                      elif chunk["type"] == "WordBoundary":
                          start_s = chunk["offset"] / 10_000_000.0
                          dur_s = chunk["duration"] / 10_000_000.0
                          word_events.append((start_s, start_s + dur_s, chunk["text"]))

          for v in voices:
              try:
                  asyncio.run(try_edge(v))
                  if os.path.exists("voice_raw.mp3") and os.path.getsize("voice_raw.mp3") > 1000:
                      audio_ok = True
                      print("Voice used:", v)
                      break
              except Exception as e:
                  print("Voice fallback:", v, e)

          if not audio_ok:
              gTTS(text=script, lang="ta" if has_tamil else "en", slow=False).save("voice_raw.mp3")

          # Studio voice EQ: boost deep chest warmth (140Hz) + vocal clarity (3.5kHz) + loudness normalization
          subprocess.run([
              "ffmpeg", "-y", "-i", "voice_raw.mp3",
              "-af", "silenceremove=start_periods=1:start_silence=0.05:start_threshold=-45dB,equalizer=f=140:t=q:w=1.2:g=4,equalizer=f=3500:t=q:w=1.5:g=3,loudnorm",
              "voice.mp3"
          ], check=True)

          cmd_dur = ["ffprobe", "-v", "error", "-show_entries", "format=duration", "-of", "default=noprint_wrappers=1:nokey=1", "voice.mp3"]
          total_dur = max(float(subprocess.check_output(cmd_dur).decode().strip()), 4.5)

          # Cinematic trailer sub-bass + atmospheric harmonic pad
          subprocess.run([
              "ffmpeg", "-y",
              "-f", "lavfi", "-i", f"sine=f=55:d={total_dur}:r=44100",
              "-f", "lavfi", "-i", f"sine=f=110:d={total_dur}:r=44100",
              "-f", "lavfi", "-i", f"anoisesrc=d={total_dur}:c=pink:r=44100:a=0.015",
              "-filter_complex",
              "[0:a]volume=0.09,tremolo=f=1.8:d=0.6[s1];"
              "[1:a]volume=0.04,tremolo=f=3.6:d=0.5[s2];"
              "[2:a]lowpass=f=280[n];"
              "[s1][s2][n]amix=inputs=3:duration=shortest[bg]",
              "-map", "[bg]", "bgm.wav"
          ], check=True)

          # 2. Build clean center-lower viral captions with Noto Sans Tamil / Montserrat
          def fmt_ass(sec):
              h = int(sec // 3600)
              m = int((sec % 3600) // 60)
              s = int(sec % 60)
              cs = int((sec - int(sec)) * 100)
              return f"{h}:{m:02d}:{s:02d}.{cs:02d}"

          font_name = "Noto Sans Tamil" if has_tamil else "Montserrat"
          font_size = 64 if has_tamil else 82

          ass_header = f"""[Script Info]
          ScriptType: v4.00+
          PlayResX: 1080
          PlayResY: 1920

          [V4+ Styles]
          Format: Name, Fontname, Fontsize, PrimaryColour, SecondaryColour, OutlineColour, BackColour, Bold, Italic, Underline, StrikeOut, ScaleX, ScaleY, Spacing, Angle, BorderStyle, Outline, Shadow, Alignment, MarginL, MarginR, MarginV, Encoding
          Style: MainPop,{font_name},{font_size},&H00FFFFFF,&H0000D7FF,&H00000000,&HAA000000,-1,0,0,0,100,100,0,0,1,6,3,2,70,70,340,1
          Style: GoldPop,{font_name},{font_size + 4},&H0033D7FF,&H00FFFFFF,&H00000000,&HAA000000,-1,0,0,0,103,103,0,0,1,6,4,2,70,70,340,1

          [Events]
          Format: Layer, Start, End, Style, Name, MarginL, MarginR, MarginV, Effect, Text
          """

          events = []
          if word_events:
              idx = 0
              c_idx = 0
              while idx < len(word_events):
                  grp = word_events[idx:idx+3]
                  t0 = grp[0][0]
                  t1 = word_events[idx+3][0] if (idx + 3) < len(word_events) else max(grp[-1][1] + 0.15, total_dur)
                  txt = " ".join(w[2] for w in grp).strip()
                  st = "GoldPop" if c_idx % 3 == 2 else "MainPop"
                  anim = r"{\fscx88\fscy88\t(0,85,\fscx102\fscy102)\t(85,150,\fscx100\fscy100)}"
                  events.append(f"Dialogue: 0,{fmt_ass(t0)},{fmt_ass(t1)},{st},,0,0,0,,{anim}{txt}")
                  idx += 3
                  c_idx += 1
          else:
              words = script.split()
              chunks = [" ".join(words[i:i+3
