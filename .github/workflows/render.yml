name: Render Short Video

on:
  workflow_dispatch:
    inputs:
      topic_id:
        description: 'Topic ID'
        required: true
      topic_title:
        description: 'Topic Title'
        required: true
      script:
        description: 'Script'
        required: true

jobs:
  build-video:
    runs-on: ubuntu-latest
    steps:
      - name: Install Tools
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
          pip install edge-tts pillow

      - name: Generate Voiceover, Subtitles & 3 Scenes
        env:
          SCRIPT_TEXT: ${{ github.event.inputs.script }}
          TOPIC_TITLE: ${{ github.event.inputs.topic_title }}
          TOPIC_ID: ${{ github.event.inputs.topic_id }}
        run: |
          cat << 'EOF' > make_video.py
          import asyncio, os, re, subprocess, urllib.parse, urllib.request
          import edge_tts
          from PIL import Image, ImageDraw

          script = os.environ["SCRIPT_TEXT"].strip()
          title = os.environ["TOPIC_TITLE"].strip()
          topic_id = os.environ["TOPIC_ID"].strip()

          async def make_audio():
              comm = edge_tts.Communicate(script, "en-US-AndrewMultilingualNeural")
              subs = edge_tts.SubMaker()
              with open("voice.mp3", "wb") as af:
                  async for chunk in comm.stream():
                      if chunk["type"] == "audio":
                          af.write(chunk["data"])
                      elif chunk["type"] == "WordBoundary":
                          subs.feed(chunk)
              with open("captions.srt", "w", encoding="utf-8") as sf:
                  sf.write(subs.get_srt())

          asyncio.run(make_audio())

          parts = [s.strip() for s in re.split(r'(?<=[.!?])\s+', script) if s.strip()]
          while len(parts) < 3:
              parts.append(title)

          prompts = [
              f"{title}, vibrant 3d digital illustration, vertical 9:16",
              f"{parts[0][:80]}, colorful modern concept art, vertical 9:16",
              f"{parts[-1][:80]}, inspiring glowing aesthetic, vertical 9:16"
          ]

          for i, p in enumerate(prompts):
              url = f"https://image.pollinations.ai/prompt/{urllib.parse.quote(p)}?width=1080&height=1920&nologo=true&seed={i+10}"
              fname = f"scene_{i}.jpg"
              try:
                  req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
                  with urllib.request.urlopen(req, timeout=45) as r:
                      open(fname, "wb").write(r.read())
                  img = Image.open(fname).convert("RGB")
                  w, h = img.size
                  img = img.crop((0, 0, w, int(h * 0.94))).resize((1080, 1920), Image.LANCZOS)
                  img.save(fname, "JPEG", quality=92)
              except Exception:
                  img = Image.new("RGB", (1080, 1920), (20, 25, 45))
                  draw = ImageDraw.Draw(img)
                  for y in range(1920):
                      draw.line([(0, y), (1080, y)], fill=(20 + i*15, int(25 + y/35), int(55 + y/20)))
                  img.save(fname, "JPEG")

          cmd_dur = ["ffprobe", "-v", "error", "-show_entries", "format=duration", "-of", "default=noprint_wrappers=1:nokey=1", "voice.mp3"]
          total_dur = max(float(subprocess.check_output(cmd_dur).decode().strip()), 3.0)
          seg = total_dur / 3.0
          frames = int(seg * 30)

          safe_title = re.sub(r"[^A-Za-z0-9 \-]", "", title.upper())[:36]
          font_path = "/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf"
          sub_style = "FontName=DejaVu Sans,FontSize=18,Bold=1,PrimaryColour=&H00FFFFFF,OutlineColour=&H00000000,BorderStyle=1,Outline=3,Shadow=1,Alignment=2,MarginV=260"

          fc = (
              f"[0:v]scale=1200:2133,zoompan=z='min(zoom+0.0008,1.12)':d={frames}:s=1080x1920:fps=30,trim=duration={seg},setpts=PTS-STARTPTS[v0];"
              f"[1:v]scale=1200:2133,zoompan=z='1.12-0.0008*on':d={frames}:s=1080x1920:fps=30,trim=duration={seg},setpts=PTS-STARTPTS[v1];"
              f"[2:v]scale=1200:2133,zoompan=z='min(zoom+0.0008,1.12)':d={frames}:s=1080x1920:fps=30,trim=duration={seg},setpts=PTS-STARTPTS[v2];"
              f"[v0][v1][v2]concat=n=3:v=1:a=0[bg];"
              f"[bg]drawbox=x=0:y=0:w=1080:h=220:color=black@0.55:t=fill,"
              f"drawtext=fontfile={font_path}:text='{safe_title}':fontcolor=yellow:fontsize=46:x=(w-text_w)/2:y=95,"
              f"subtitles=captions.srt:force_style='{sub_style}'[outv]"
          )

          subprocess.run([
              "ffmpeg", "-y",
              "-loop", "1", "-t", str(seg + 1), "-i", "scene_0.jpg",
              "-loop", "1", "-t", str(seg + 1), "-i", "scene_1.jpg",
              "-loop", "1", "-t", str(seg + 1), "-i", "scene_2.jpg",
              "-i", "voice.mp3",
              "-filter_complex", fc,
              "-map", "[outv]", "-map", "3:a",
              "-c:v", "libx264", "-preset", "fast", "-crf", "22",
              "-c:a", "aac", "-b:a", "192k", "-pix_fmt", "yuv420p", "-shortest",
              f"{topic_id}.mp4"
          ], check=True)
          EOF
          python3 make_video.py

      - name: Upload Video to Google Drive & Update Sheet
        env:
          WEBHOOK_URL: ${{ secrets.APPS_SCRIPT_URL }}
          TOPIC_ID: ${{ github.event.inputs.topic_id }}
        run: |
          cat << 'EOF' > upload.py
          import base64, json, os, urllib.request
          with open(f"{os.environ['TOPIC_ID']}.mp4", "rb") as f:
              b64 = base64.b64encode(f.read()).decode("utf-8")
          body = json.dumps({"topic_id": os.environ["TOPIC_ID"], "video_base64": b64}).encode("utf-8")
          req = urllib.request.Request(os.environ["WEBHOOK_URL"], data=body, headers={"Content-Type": "application/json"})
          with urllib.request.urlopen(req, timeout=60) as resp:
              print("Apps Script response:", resp.read().decode())
          EOF
          python3 upload.py
